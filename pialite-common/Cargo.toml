[package]
name = "pialite-common"
version = "0.9.4"
edition = "2021"
description = "Shared code for the PIA Lite tray and guard: piactl runner, guard status types, IPC client"
license = "GPL-3.0-or-later"
repository = "https://github.com/NicholasBly/PIALite"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
