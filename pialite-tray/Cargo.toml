[package]
name = "pialite-tray"
version = "0.9.8"
edition = "2021"
description = "Lightweight tray app for Private Internet Access (talks to PIA through its official piactl tool)"
license = "GPL-3.0-or-later"
repository = "https://github.com/NicholasBly/PIALite"

[dependencies]
pialite-common = { path = "../pialite-common" }
serde_json = "1"
# Only what we use: winit window backend + CPU (software) renderer, system fonts,
# built-in tray icon, and the winit hooks (no taskbar button, close on focus loss).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "system-tray",
    "unstable-winit-030",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

# Linux: X11 and Wayland windows (the tray icon itself is a StatusNotifierItem).
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit-x11", "backend-winit-wayland"] }
libc = "0.2"
# is the tray (StatusNotifierWatcher) there, and is our icon registered? (already used by Slint's tray)
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
# Windows: version info + icon in the .exe (the MSI compares file versions)
winresource = "0.1"
slint-build = "1.18"
