name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the release workflow runs this whole workflow and publishes only the
  # packages it built and installed (review V95-13)
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, tests, nftables, packages, real install)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0" # = rust-toolchain.toml
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev nftables rpm iproute2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: |
          rustc -V
          cargo build --release
      - name: Firewall self-test (real nftables, in its own network namespace)
        run: sudo unshare --net ./target/release/pialite-guard selftest-firewall
      # the shell tests run in their own mount namespace (tests/isolate.sh). A
      # stand-in "real install" at EVERY real path install.sh can touch must be
      # untouched afterwards - also when the tests are started from a namespace
      # whose mounts are shared (reviews R98-01, N99-01, N99-07). And in
      # throwaway roots missing a folder the tests write under, they must
      # refuse before creating it (R10-01). Nothing new may appear in the real
      # /tmp either: the tests' own work folders are private (V11-03).
      - name: install.sh tests (uninstall checks, upgrade rollback) - isolated from real files
        run: |
          sentinels="/opt/pialite/MARKER /etc/xdg/autostart/pialite-tray.desktop /usr/local/bin/pialite-guard \
            /usr/local/share/applications/pialite.desktop /var/lib/pialite/guard.json /etc/systemd/system/pialite-guard.service \
            /run/pialite-install/lock /tmp/pialite-sentinel"
          for f in $sentinels; do sudo mkdir -p "$(dirname "$f")"; echo sentinel | sudo tee "$f" >/dev/null; done
          sudo find /tmp -mindepth 1 -maxdepth 1 -user root | sort > "$RUNNER_TEMP/tmp-before"
          sudo sh tests/isolate-preflight.sh
          sudo sh tests/install-sh-uninstall.sh
          sudo sh tests/install-sh-upgrade.sh
          sudo unshare --mount --propagation shared sh tests/install-sh-uninstall.sh
          for f in $sentinels; do
            test "$(sudo cat "$f" 2>/dev/null)" = sentinel || { echo "a test touched the real $f"; exit 1; }
          done
          if grep -q -e pialite-test -e preflight /proc/self/mounts; then echo "a test's mounts leaked out"; exit 1; fi
          sudo find /tmp -mindepth 1 -maxdepth 1 -user root | sort > "$RUNNER_TEMP/tmp-after"
          if comm -13 "$RUNNER_TEMP/tmp-before" "$RUNNER_TEMP/tmp-after" | grep .; then echo "a test left files in the real /tmp (above)"; exit 1; fi
          if sudo losetup -a | grep -q opt.img; then echo "a test left a loop device attached"; exit 1; fi
          for f in $sentinels; do sudo rm -f "$f"; done
          sudo rmdir /opt/pialite /var/lib/pialite /run/pialite-install 2>/dev/null || true
      - name: Packages (.deb, .rpm, .tar.gz)
        run: packaging/linux/build-packages.sh "$(grep -m1 '^version' pialite-guard/Cargo.toml | cut -d'"' -f2)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: dist/*
      # after the upload: from here on this machine's DNS goes through PIA Lite
      - name: Install the .deb and set up the guard (systemd, DNS redirect)
        id: install
        run: |
          sudo apt-get install -y ./dist/pialite_*_amd64.deb
          sudo pialite-guard setup --features guard,dns --dns quad9 --mode off
          sudo pialite-guard features
          sudo pialite-guard status
          getent hosts example.com
          sudo pialite-guard test-dns
          pialite-guard adapter-dns
      # live third-party servers: on pushes and releases, not on pull requests
      # (an outage there shouldn't fail an unrelated change)
      - name: Every built-in DNS provider answers (live)
        if: github.event_name != 'pull_request'
        run: |
          for p in cloudflare adguard google quad9; do
            echo "== $p"
            sudo pialite-guard set-dns "$p"
            sudo pialite-guard test-doh
          done
          getent hosts github.com
      # only after an install was started (an earlier failure stays the one reported, G97-08)
      - name: Remove the package (teardown) and check nothing is left
        if: always() && steps.install.outcome != 'skipped'
        run: |
          rc=0
          # removed only if it got installed; the checks below run either way (R98-08)
          if [ "$(dpkg-query -W -f='${Status}' pialite 2>/dev/null)" = "install ok installed" ]; then
            sudo apt-get remove -y pialite || rc=$?
          else
            echo "the package never got installed - nothing to remove (see the install step's error)"
          fi
          # "can't look" is a failure, not "nothing there"
          tables=$(sudo nft list tables) || { echo "nftables can't be inspected"; exit 1; }
          if printf '%s\n' "$tables" | grep -q pialite; then sudo nft list ruleset; echo "PIA Lite tables left behind"; exit 1; fi
          units=$(systemctl list-unit-files --no-legend) || { echo "systemd can't be asked"; exit 1; }
          if printf '%s\n' "$units" | grep -q pialite-guard; then echo "service left behind"; exit 1; fi
          # "remove" keeps the config: "deinstall ok config-files" is gone, "install ok installed" is not
          if [ "$(dpkg-query -W -f='${Status}' pialite 2>/dev/null)" = "install ok installed" ]; then echo "package still installed"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "apt-get remove failed ($rc)"; exit 1; fi
          echo "clean"
      - name: Guard log
        if: always()
        run: sudo cat /var/lib/pialite/guard.log 2>/dev/null | tail -60 || true

  windows:
    name: Windows (build, tests, WFP, MSI install/uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0" # = rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: |
          rustc -V
          cargo build --release
      - name: Firewall self-test (real Windows Filtering Platform)
        run: .\target\release\pialite-guard.exe selftest-firewall
      - name: DNS conflict check reads this machine's adapters
        run: |
          .\target\release\pialite-guard.exe adapter-dns
          .\target\release\pialite-guard.exe adapter-dns --json
      - name: DNS report script (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          foreach ($sh in 'pwsh', 'powershell') {
            & $sh -NoProfile -ExecutionPolicy Bypass -File tools/dns-report.ps1 -Server 1.1.1.1 -Name one.one.one.one
            $r = Get-Content (Join-Path ([Environment]::GetFolderPath('Desktop')) 'PIALite-DNS-report.txt') -Raw
            foreach ($want in '== Network adapters', '== Your DNS server 1.1.1.1', 'TLS certificate     : CN=') {
              if (-not $r.Contains($want)) { throw "$sh report is missing '$want'" }
            }
            if ($r -match 'no handshake') { throw "$sh report: TLS check failed" }
          }
      - name: WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: MSI and portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path pialite-guard\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          # ICE warnings fail the build now that there are none left (G97-07)
          $out = ./packaging/windows/build.ps1 -Version $v *>&1 | Out-String
          $out
          if ($out -match 'ICE\d+') { throw "the MSI build reported ICE warnings" }
          $val = wix msi validate (Get-Item dist\*.msi).FullName *>&1 | Out-String
          $val
          if ($LASTEXITCODE -ne 0 -or $val -match 'ICE\d+') { throw "MSI validation reported problems" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          path: dist/*
      - name: Silent install (PIA isn't on this machine - its check is skipped)
        id: install
        shell: pwsh
        run: |
          $msi = (Get-Item dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$PWD\install.log`" PIACTL=1 DNS_PROVIDER=quad9 BLOCK_MODE=off" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 150; throw "install failed: $($p.ExitCode)" }
          $g = "$env:ProgramFiles\PiaLite\pialite-guard.exe"
          & $g features
          if ($LASTEXITCODE -ne 0) { throw "features failed" }
          & $g status
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          $st = (& $g status --json) | ConvertFrom-Json
          if (-not $st.version) { throw "status --json: no version" }
          sc.exe query PiaLiteGuard
          if ($LASTEXITCODE -ne 0) { throw "service not found" }
          if ((Get-Service PiaLiteGuard).Status -ne 'Running') { throw "service not running" }
          schtasks /Query /TN "PIA Lite Tray"
          if ($LASTEXITCODE -ne 0) { throw "sign-in task not found" }
          # Start menu shortcuts exist and point at the installed programs
          $sh = New-Object -ComObject WScript.Shell
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\PIA Lite"
          foreach ($l in @(@('PIA Lite.lnk', 'pialite-tray.exe'), @('PIA Lite - Unlock Internet.lnk', 'pialite-guard.exe'))) {
            $f = Join-Path $menu $l[0]
            if (-not (Test-Path $f)) { Get-ChildItem $menu -ErrorAction SilentlyContinue; throw "shortcut missing: $f" }
            $t = $sh.CreateShortcut($f).TargetPath
            if ($t -ne "$env:ProgramFiles\PiaLite\$($l[1])") { throw "$($l[0]) points at '$t'" }
          }
      - name: Uninstall and check nothing is left
        if: always() && steps.install.outcome != 'skipped'
        shell: pwsh
        run: |
          # uninstalled only if it got installed; the checks below run either way (R98-08)
          $installed = (Get-Service PiaLiteGuard -ErrorAction SilentlyContinue) -or (Test-Path "$env:ProgramFiles\PiaLite")
          if ($installed) {
            $msi = (Get-Item dist\*.msi).FullName
            $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$PWD\uninstall.log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 150; throw "uninstall failed: $($p.ExitCode)" }
          } else {
            "PIA Lite never got installed - nothing to uninstall (see the install step's error)"
          }
          if (Get-Service PiaLiteGuard -ErrorAction SilentlyContinue) { throw "service left behind" }
          .\target\release\pialite-guard.exe check-rules
          if ($LASTEXITCODE -ne 0) { throw "block rules left behind" }
          if (Test-Path "$env:ProgramFiles\PiaLite") { Get-ChildItem "$env:ProgramFiles\PiaLite"; throw "files left behind" }
          if (Test-Path "$env:ProgramData\PiaLite") { Get-ChildItem "$env:ProgramData\PiaLite"; throw "data folder left behind" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\PIA Lite") { throw "Start menu shortcuts left behind" }
      - name: Installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-msi-logs
          path: "*.log"
