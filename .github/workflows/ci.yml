name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, tests, nftables, packages, real install)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev nftables rpm iproute2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Firewall self-test (real nftables, in its own network namespace)
        run: sudo unshare --net ./target/release/pialite-guard selftest-firewall
      - name: Packages (.deb, .rpm, .tar.gz)
        run: packaging/linux/build-packages.sh "$(grep -m1 '^version' pialite-guard/Cargo.toml | cut -d'"' -f2)"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/*
      # after the upload: from here on this machine's DNS goes through PIA Lite
      - name: Install the .deb and set up the guard (systemd, DNS redirect)
        run: |
          sudo apt-get install -y ./dist/pialite_*_amd64.deb
          sudo pialite-guard setup --features guard,dns --dns quad9 --mode off
          sudo pialite-guard features
          sudo pialite-guard status
          getent hosts example.com
          sudo pialite-guard test-dns
          pialite-guard adapter-dns
      - name: Every built-in DNS provider answers (live)
        run: |
          for p in cloudflare adguard google quad9; do
            echo "== $p"
            sudo pialite-guard set-dns "$p"
            sudo pialite-guard test-doh
          done
          getent hosts github.com
      - name: Remove the package (teardown) and check nothing is left
        if: always()
        run: |
          sudo apt-get remove -y pialite || true
          if sudo nft list tables | grep -q pialite; then sudo nft list ruleset; echo "PIA Lite tables left behind"; exit 1; fi
          if systemctl list-unit-files | grep -q pialite-guard; then echo "service left behind"; exit 1; fi
          echo "clean"
      - name: Guard log
        if: always()
        run: sudo cat /var/lib/pialite/guard.log 2>/dev/null | tail -60 || true

  windows:
    name: Windows (build, tests, WFP, MSI install/uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Firewall self-test (real Windows Filtering Platform)
        run: .\target\release\pialite-guard.exe selftest-firewall
      - name: DNS conflict check reads this machine's adapters
        run: |
          .\target\release\pialite-guard.exe adapter-dns
          .\target\release\pialite-guard.exe adapter-dns --json
      - name: WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: MSI and portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path pialite-guard\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          ./packaging/windows/build.ps1 -Version $v
          wix msi validate (Get-Item dist\*.msi).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: dist/*
      - name: Silent install (PIA isn't on this machine - its check is skipped)
        shell: pwsh
        run: |
          $msi = (Get-Item dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$PWD\install.log`" PIACTL=1 DNS_PROVIDER=quad9 BLOCK_MODE=off" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 150; throw "install failed: $($p.ExitCode)" }
          $g = "$env:ProgramFiles\PiaLite\pialite-guard.exe"
          & $g features
          & $g status
          sc.exe query PiaLiteGuard
          schtasks /Query /TN "PIA Lite Tray"
      - name: Uninstall and check nothing is left
        if: always()
        shell: pwsh
        run: |
          $msi = (Get-Item dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$PWD\uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 150; throw "uninstall failed: $($p.ExitCode)" }
          if (Get-Service PiaLiteGuard -ErrorAction SilentlyContinue) { throw "service left behind" }
          .\target\release\pialite-guard.exe check-rules
          if ($LASTEXITCODE -ne 0) { throw "block rules left behind" }
          if (Test-Path "$env:ProgramFiles\PiaLite") { Get-ChildItem "$env:ProgramFiles\PiaLite"; throw "files left behind" }
          if (Test-Path "$env:ProgramData\PiaLite") { Get-ChildItem "$env:ProgramData\PiaLite"; throw "data folder left behind" }
      - name: Installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi-logs
          path: "*.log"
