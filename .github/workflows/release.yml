name: Release

# A new version on main publishes itself: when the version in Cargo.toml has
# no GitHub release yet (or a tag vX.Y.Z is pushed), the whole CI workflow
# runs (ci.yml: tests, firewall self-tests, packages, real install/uninstall);
# only if all of it passes are its packages published, with SHA256SUMS signed
# (if the RELEASE_SIGNING_KEY secret is set). Pushes that don't change the
# version stop after one quick check.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' pialite-guard/Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $v"; exit 1
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$v already exists - nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release v$v doesn't exist yet - building it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # the whole CI workflow: format, clippy, tests, real firewall self-tests,
  # packages, a real install / uninstall on both systems - the release
  # publishes exactly the packages it built and installed (review V95-13)
  ci:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    # only this job may write (creates the release and its tag)
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages
          path: dist
      - name: Exactly the expected files, with this version
        run: |
          v="$VERSION"
          printf '%s\n' "PIALite-$v-linux-x86_64.tar.gz" "PIALite-$v-windows-x64-portable.zip" "PIALite-$v-windows-x64.msi" \
            "pialite-$v-1.x86_64.rpm" "pialite_${v}_amd64.deb" | sort > want.txt
          ls dist | sort > have.txt
          diff -u want.txt have.txt
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Sign the checksums (the updater installs only signed releases)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set - this release is NOT signed; the updater will only point to the download page"
            echo "unsigned" > "$RUNNER_TEMP/unsigned"
            exit 0
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # must match the public key built into the programs
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; base64 -d keys/release-signing.pub; } > "$RUNNER_TEMP/pub.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
      - name: Release notes from CHANGELOG.md
        run: |
          v="$VERSION"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo "| | |"
            echo "|---|---|"
            echo "| Windows installer (choose features) | \`PIALite-$v-windows-x64.msi\` |"
            echo "| Windows portable (tray only) | \`PIALite-$v-windows-x64-portable.zip\` |"
            echo "| Debian / Ubuntu / Mint | \`pialite_${v}_amd64.deb\` |"
            echo "| Fedora / openSUSE / RHEL | \`pialite-$v-1.x86_64.rpm\` |"
            echo "| Any Linux (install.sh or portable) | \`PIALite-$v-linux-x86_64.tar.gz\` |"
            echo
            if [ -f "$RUNNER_TEMP/unsigned" ]; then
              echo "Checksums: \`SHA256SUMS\`. **This release is not signed** - PIA Lite's built-in updater won't install it; download it here instead."
            else
              echo "Checksums: \`SHA256SUMS\` (signed: \`SHA256SUMS.sig\`, ed25519 key in \`keys/release-signing.pub\`)."
            fi
          } >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # creates the tag vX.Y.Z on this commit if it isn't there yet
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "PIA Lite $VERSION" --notes-file notes.md
